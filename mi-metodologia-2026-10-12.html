<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<title>Metodología diaria</title>
<style>
  :root{
    --bg:#F7F7F5;
    --card:#FFFFFF;
    --text:#1C1C1A;
    --text-muted:#8A8A85;
    --border:rgba(0,0,0,0.07);
    --radius:16px;
    --trabajo-bg:#E8ECFF; --trabajo-fg:#3346B3; --trabajo-mid:#4C6FFF;
    --familia-bg:#E3F7EC; --familia-fg:#127A4B; --familia-mid:#22A06B;
    --salud-bg:#FDEEE0;   --salud-fg:#B45E12;   --salud-mid:#F2994A;
    --hogar-bg:#FDF6DC;   --hogar-fg:#8A6B0A;   --hogar-mid:#E8B923;
    --comida-bg:#F3E8FA;  --comida-fg:#6C3483;  --comida-mid:#9B59B6;
    --descanso-bg:#EFEFED;--descanso-fg:#6B6B66; --descanso-mid:#9AA0A6;
    --contenido-bg:#FBF1DC;--contenido-fg:#8A6412; --contenido-mid:#D4A032;
  }
  * { box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{ max-width:960px; margin:0 auto; }
  h1{ font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub{ font-size:14px; color:var(--text-muted); margin:0 0 24px; }

  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:-8px 0 18px; }
  .tool-btn{
    -webkit-appearance:none; appearance:none; font-family:inherit; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:999px; cursor:pointer; touch-action:manipulation;
    background:var(--card); color:var(--text); border:1px solid rgba(0,0,0,0.18);
  }
  .tool-btn:hover{ border-color:var(--text); }
  .tool-btn.primary{ background:var(--text); color:#fff; border-color:var(--text); }
  .tool-btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .tool-status{ font-size:12px; color:var(--text-muted); font-weight:500; flex:1 1 220px; }

  .tabs{ display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap; }
  .tab{
    padding:9px 16px; border-radius:999px; font-size:14px; font-weight:500;
    background:var(--card); border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; transition:all .15s ease; user-select:none;
  }
  .tab.active{ background:var(--text); color:#fff; border-color:var(--text); }
  .tab:hover:not(.active){ border-color:rgba(0,0,0,0.18); color:var(--text); }

  .view{ display:none; }
  .view.active{ display:block; }

  .days{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }
  @media (max-width:900px){ .days{ grid-template-columns:repeat(2,1fr); } }
  .days.day-mode{ grid-template-columns:1fr; max-width:340px; }

  .week-controls{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .mode-toggle{ display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .mode-btn{ border:none; background:transparent; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .mode-btn.active{ background:var(--text); color:#fff; }
  .day-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .day-pill{ border:1px solid var(--border); background:var(--card); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .day-pill.active{ background:var(--text); color:#fff; border-color:var(--text); }
  .day-col{ display:flex; flex-direction:column; gap:8px; }
  .day-title{
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-muted); padding:0 2px 4px; border-bottom:1px solid var(--border);
    margin-bottom:2px;
  }
  .block{
    border-radius:var(--radius); padding:10px 12px; position:relative;
    display:flex; flex-direction:column; gap:2px; min-height:44px; justify-content:center;
  }
  .block .time{ font-size:11px; font-weight:500; opacity:.75; }
  .block .label{
    font-size:13px; font-weight:600; line-height:1.2; white-space:normal;
    word-break:break-word; overflow-wrap:break-word; color:inherit; padding-right:14px;
  }
  .block .label.small{ font-size:11px; }
  .block select{
    position:absolute; inset:0; opacity:0; border:none; background:transparent;
    width:100%; height:100%; cursor:pointer; appearance:none; -webkit-appearance:none;
  }
  .block select:focus{ outline:none; }
  .block select:focus + .label{ outline:2px solid rgba(0,0,0,0.15); outline-offset:2px; border-radius:4px; }
  .block .del-block{
    position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.08); color:inherit; font-size:11px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:.6;
  }
  .block .del-block:hover{ opacity:1; background:rgba(0,0,0,0.18); }
  .block .edit-block{
    position:absolute; top:6px; right:28px; width:18px; height:18px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.08); color:inherit; font-size:11px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:.6; padding:0;
  }
  .block .edit-block:hover{ opacity:1; background:rgba(0,0,0,0.18); }
  .add-block-form .form-error{ font-size:12px; font-weight:600; color:#B3261E; }

  .add-block-btn{
    border:1.5px dashed var(--border); border-radius:var(--radius); background:transparent;
    color:var(--text-muted); font-size:12px; font-weight:500; padding:8px; cursor:pointer;
    text-align:center;
  }
  .add-block-btn:hover{ border-color:rgba(0,0,0,0.25); color:var(--text); }
  .add-block-form{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px; display:flex; flex-direction:column; gap:6px;
  }
  .add-block-form label{ font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; }
  .add-block-form input[type=time], .add-block-form input[type=text], .add-block-form select{
    width:100%; padding:6px 8px; border-radius:8px; border:1px solid var(--border);
    font-size:13px; font-family:inherit; background:var(--bg); color:var(--text);
  }
  .add-block-form .btn-row{ display:flex; gap:6px; margin-top:2px; }
  .add-block-form button{
    flex:1; border:none; border-radius:8px; padding:7px; font-size:12px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .add-block-form .save-btn{ background:var(--text); color:#fff; }
  .add-block-form .cancel-btn{ background:transparent; color:var(--text-muted); }

  .cat-trabajo   { background:var(--trabajo-bg);   color:var(--trabajo-fg); }
  .cat-familia   { background:var(--familia-bg);   color:var(--familia-fg); }
  .cat-salud     { background:var(--salud-bg);     color:var(--salud-fg); }
  .cat-hogar     { background:var(--hogar-bg);     color:var(--hogar-fg); }
  .cat-comida    { background:var(--comida-bg);    color:var(--comida-fg); }
  .cat-descanso  { background:var(--descanso-bg);  color:var(--descanso-fg); }
  .cat-contenido { background:var(--contenido-bg); color:var(--contenido-fg); }

  .legend{ display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 4px; }
  .chip{ font-size:12px; font-weight:500; padding:5px 12px; border-radius:999px; }

  /* Tasks / habits */
  .list-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:6px; margin-bottom:10px;
  }
  .row{
    display:grid; grid-template-columns:1fr repeat(7,36px) 92px; align-items:center;
    gap:6px; padding:8px 10px; border-radius:12px;
  }
  .row.header{ font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
  .row input[type=text]{
    border:none; background:transparent; font-size:14px; font-weight:500; color:var(--text);
    font-family:inherit; padding:4px 2px; width:100%;
  }
  .row input[type=text]:focus{ outline:none; background:var(--bg); border-radius:8px; }
  .name-cell{ display:flex; align-items:center; gap:4px; min-width:0; }
  .check{
    -webkit-appearance:none; appearance:none; padding:0; font-family:inherit;
    width:30px; height:30px; border-radius:9px; border:1.5px solid rgba(0,0,0,0.22);
    background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; color:transparent; font-weight:700; transition:all .12s ease; justify-self:center;
    touch-action:manipulation;
  }
  .check:hover{ border-color:var(--familia-mid); }
  .check:focus-visible, .del:focus-visible, .reset-btn:focus-visible, .add-row:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .check.on{ background:var(--familia-mid); border-color:var(--familia-mid); color:#fff; }
  .pct{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; font-size:13px; font-weight:600; color:var(--text-muted); }
  .pct.has-progress{ color:var(--familia-fg); }
  .bar{ width:100%; height:6px; border-radius:999px; background:#EAEAE6; overflow:hidden; }
  .bar-fill{ height:100%; width:0; border-radius:999px; background:var(--familia-mid); transition:width .25s ease; }
  .overall{ padding:12px 14px 14px; margin:2px 0 4px; }
  .overall-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; font-size:13px; font-weight:600; color:var(--text-muted); }
  .overall-top strong{ font-size:22px; color:var(--text); letter-spacing:-0.01em; }
  .overall-note{ margin-top:7px; font-size:12px; color:var(--text-muted); font-weight:500; }
  .overall .bar{ height:10px; }
  .reset-row{ display:flex; justify-content:flex-end; padding:2px 10px 8px; }
  .reset-btn{ border:none; background:transparent; font-family:inherit; font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer; padding:6px 8px; border-radius:8px; }
  .reset-btn:hover{ color:var(--text); background:var(--bg); }
  .add-row{
    display:flex; align-items:center; gap:8px; padding:12px 10px; font-size:13px;
    color:var(--text-muted); cursor:pointer; font-weight:500;
  }
  .add-row:hover{ color:var(--text); }
  .del{
    width:28px; height:28px; flex:none; border-radius:8px; border:none; background:transparent;
    color:var(--text-muted); cursor:pointer; font-size:14px; justify-self:center;
  }
  .del:hover{ color:#C0392B; }

  .summary{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:4px; }
  @media (max-width:900px){ .summary{ grid-template-columns:repeat(2,1fr); } }
  .summary .cell{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:10px; text-align:center;
  }
  .summary .cell .d{ font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; }
  .summary .cell .v{ font-size:18px; font-weight:600; margin-top:2px; }
  .summary .cell .bar{ margin-top:8px; }

  @media (max-width:600px){
    .row{ grid-template-columns:repeat(7,1fr) 64px; gap:4px; padding:8px 6px; }
    .row .name-cell{ grid-column:1 / -1; }
    .row.header > div:first-child{ display:none; }
    .check{ width:100%; max-width:38px; height:34px; }
    .pct{ font-size:12px; }
  }
</style>
</head>

const DEFAULT_TASKS = [
  {id:"t1", name:"", days:[false,false,false,false,false,false,false]}
];
const DEFAULT_HABITS = [
  {id:"h1", name:"", days:[false,false,false,false,false,false,false]}
];

let state = {
  schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
  tareas: JSON.parse(JSON.stringify(DEFAULT_TASKS)),
  habitos: JSON.parse(JSON.stringify(DEFAULT_HABITS))
};

function readEmbedded(){
  const el = document.getElementById('copia-guardada');
  if(!el) return null;
  try{ const p = JSON.parse(el.textContent); return (p && p.id && p.state) ? p : null; }
  catch(e){ return null; }
}
const EMBEDDED = readEmbedded();
// Cada copia descargada guarda sus cambios en su propia clave, así no se pisan entre sí
const STORAGE_KEY = EMBEDDED ? 'planner-state:' + EMBEDDED.id : 'planner-state';

function cloneDefault(x){ return JSON.parse(JSON.stringify(x)); }

function cleanList(list, fallback){
  if(!Array.isArray(list)) return cloneDefault(fallback);
  return list.map((it, i) => {
    const days = (it && Array.isArray(it.days)) ? it.days : [];
    return {
      id: (it && it.id) ? it.id : 'item' + Date.now() + '-' + i,
      name: (it && typeof it.name === 'string') ? it.name : '',
      days: DAYS.map((_, di) => days[di] === true)
    };
  });
}

function normalizeState(saved){
  saved = (saved && typeof saved === 'object') ? saved : {};
  return {
    schedule: (saved.schedule && typeof saved.schedule === 'object') ? saved.schedule : cloneDefault(DEFAULT_SCHEDULE),
    tareas: cleanList(saved.tareas, DEFAULT_TASKS),
    habitos: cleanList(saved.habitos, DEFAULT_HABITS)
  };
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = normalizeState(JSON.parse(raw)); }
    else if(EMBEDDED){ state = normalizeState(EMBEDDED.state); }
  }catch(e){
    console.warn('Este navegador bloquea el guardado local; los cambios no van a persistir al recargar.', e);
    if(EMBEDDED){ try{ state = normalizeState(EMBEDDED.state); }catch(_){} }
  }
  try{ renderAll(); }
  catch(e){ console.error('Error al renderizar', e); }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* guardado no disponible en este navegador, seguimos sin romper la app */ }
}

// ---------- Descargar / cargar mi copia ----------
let statusTimer = null;
function setStatus(msg){
  const el = document.getElementById('estado-copia');
  if(!el) return;
  el.textContent = msg;
  clearTimeout(statusTimer);
  if(msg) statusTimer = setTimeout(() => { el.textContent = ''; }, 14000);
}

function buildCopyHtml(){
  const root = PRISTINE.cloneNode(true);
  const old = root.querySelector('#copia-guardada');
  if(old) old.remove();
  const payload = {
    id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    savedAt: new Date().toISOString(),
    state: state
  };
  const tag = document.createElement('script');
  tag.id = 'copia-guardada';
  tag.type = 'application/json';
  tag.textContent = JSON.stringify(payload).replace(/</g, '\\u003c');
  const main = root.querySelector('body > script:not([type])');
  main.parentNode.insertBefore(tag, main);
  return '<!DOCTYPE html>\n' + root.outerHTML;
}

function downloadCopy(){
  try{
    const html = buildCopyHtml();
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mi-metodologia-' + stamp + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setStatus('Listo, se descargó tu copia. Para usarla en otro dispositivo, tocá «Cargar mi copia» y elegí ese archivo.');
  }catch(e){
    console.error('Error al descargar la copia', e);
    setStatus('No se pudo descargar la copia en este navegador.');
  }
}

function importCopy(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => setStatus('No se pudo leer ese archivo.');
  reader.onload = () => {
    let incoming;
    try{
      const text = String(reader.result || '');
      let payload;
      if(text.trim().charAt(0) === '{'){ payload = JSON.parse(text); }
      else{
        const doc = new DOMParser().parseFromString(text, 'text/html');
        const el = doc.getElementById('copia-guardada');
        if(!el) throw new Error('sin-copia');
        payload = JSON.parse(el.textContent);
      }
      const st = (payload && payload.state) ? payload.state : payload;
      if(!st || typeof st !== 'object' || !(st.tareas || st.habitos || st.schedule)) throw new Error('sin-copia');
      incoming = normalizeState(st);
    }catch(e){
      setStatus('Ese archivo no tiene una copia guardada. Elegí el que descargaste con «Descargar mi copia».');
      return;
    }
    if(!confirm('Esto reemplaza lo que tenés cargado ahora en este dispositivo. ¿Querés seguir?')) return;
    state = incoming;
    saveState();
    renderAll();
    setStatus('Copia cargada.');
  };
  reader.readAsText(file);
}

// Tipo (color) de cada bloque: lo que figura en la leyenda
const CAT_CLASS = {};
Object.values(CATEGORIES).forEach(([name, cls]) => { CAT_CLASS[name] = cls; });
CAT_CLASS['Otro'] = 'cat-descanso';
const CAT_NAMES = Object.keys(CAT_CLASS);

function blockCatName(b){
  if(b.cat && CAT_CLASS[b.cat]) return b.cat;
  return (CATEGORIES[b.activity] || ['Otro'])[0];
}
function blockCatClass(b){ return CAT_CLASS[blockCatName(b)] || 'cat-descanso'; }

// Formulario para agregar un bloque nuevo o editar uno existente.
// La actividad se escribe libremente; las de la lista aparecen como sugerencias.
function buildBlockForm(initial, opts){
  const form = document.createElement('div');
  form.className = 'add-block-form';
  const mkLabel = (t) => { const l = document.createElement('label'); l.textContent = t; return l; };

  const startInput = document.createElement('input'); startInput.type = 'time'; startInput.value = initial.start;
  const endInput = document.createElement('input'); endInput.type = 'time'; endInput.value = initial.end;

  const actInput = document.createElement('input');
  actInput.type = 'text';
  actInput.maxLength = 40;
  actInput.placeholder = 'Ej: irme a Narnia';
  actInput.value = initial.activity || '';
  actInput.setAttribute('list', 'actividades-sugeridas');
  actInput.setAttribute('autocomplete', 'off');

  const catSelect = document.createElement('select');
  CAT_NAMES.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    catSelect.appendChild(opt);
  });
  catSelect.value = initial.cat || 'Otro';

  // Si el texto coincide con una actividad de la lista, el tipo se completa solo
  let catTouched = false;
  catSelect.addEventListener('change', () => { catTouched = true; });
  actInput.addEventListener('input', () => {
    if(catTouched) return;
    const key = actInput.value.trim().toUpperCase();
    if(CATEGORIES[key]) catSelect.value = CATEGORIES[key][0];
  });

  const error = document.createElement('div');
  error.className = 'form-error';
  error.setAttribute('role', 'alert');

  const save = () => {
    error.textContent = '';
    let activity = actInput.value.trim();
    if(!activity){ error.textContent = 'Escribí qué actividad es.'; actInput.focus(); return; }
    if(!startInput.value || !endInput.value){ error.textContent = 'Completá la hora de inicio y de fin.'; return; }
    if(endInput.value <= startInput.value){ error.textContent = 'La hora de fin debe ser posterior a la de inicio.'; return; }
    const key = activity.toUpperCase();
    if(CATEGORIES[key]) activity = key;
    opts.onSave({start: startInput.value, end: endInput.value, activity: activity, cat: catSelect.value});
  };
  actInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); save(); } });

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const saveBtn = document.createElement('button');
  saveBtn.type = 'button'; saveBtn.className = 'save-btn'; saveBtn.textContent = opts.saveLabel || 'Agregar';
  saveBtn.addEventListener('click', save);
  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button'; cancelBtn.className = 'cancel-btn'; cancelBtn.textContent = 'Cancelar';
  cancelBtn.addEventListener('click', opts.onCancel);
  btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);

  form.appendChild(mkLabel('Desde')); form.appendChild(startInput);
  form.appendChild(mkLabel('Hasta')); form.appendChild(endInput);
  form.appendChild(mkLabel('Actividad')); form.appendChild(actInput);
  form.appendChild(mkLabel('Tipo (color)')); form.appendChild(catSelect);
  form.appendChild(error);
  form.appendChild(btnRow);
  form._focus = () => actInput.focus();
  return form;
}

function showAddBlockForm(col, weekKey, day, containerId, addBtn){
  if(col.querySelector('.add-block-form')) return; // ya hay uno abierto
  addBtn.style.display = 'none';
  const form = buildBlockForm({start:'09:00', end:'10:00', activity:'', cat:'Otro'}, {
    saveLabel: 'Agregar',
    onSave: (v) => {
      state.schedule[weekKey][day].push(v);
      state.schedule[weekKey][day].sort((x, y) => x.start.localeCompare(y.start));
      saveState();
      renderWeek(weekKey, containerId);
    },
    onCancel: () => renderWeek(weekKey, containerId)
  });
  col.appendChild(form);
  form._focus();
}

const uiState = {}; // { containerId: { mode: 'week'|'day', day: 'LUNES' } }

function renderWeekControls(weekKey, containerId){
  if(!uiState[containerId]) uiState[containerId] = { mode: 'week', day: 'LUNES' };
  const ui = uiState[containerId];
  const bar = document.querySelector('#' + containerId + ' .week-controls');
  bar.innerHTML = '';

  const toggle = document.createElement('div');
  toggle.className = 'mode-toggle';
  const weekBtn = document.createElement('button');
  weekBtn.className = 'mode-btn' + (ui.mode === 'week' ? ' active' : '');
  weekBtn.textContent = 'Semana completa';
  weekBtn.addEventListener('click', () => { ui.mode = 'week'; renderWeek(weekKey, containerId); });
  const dayBtn = document.createElement('button');
  dayBtn.className = 'mode-btn' + (ui.mode === 'day' ? ' active' : '');
  dayBtn.textContent = 'Vista diaria';
  dayBtn.addEventListener('click', () => { ui.mode = 'day'; renderWeek(weekKey, containerId); });
  toggle.appendChild(weekBtn); toggle.appendChild(dayBtn);
  bar.appendChild(toggle);

  if(ui.mode === 'day'){
    const pills = document.createElement('div');
    pills.className = 'day-pills';
    DAYS.forEach((day, di) => {
      const pill = document.createElement('div');
      pill.className = 'day-pill' + (ui.day === day ? ' active' : '');
      pill.textContent = DAYS_SHORT[di];
      pill.addEventListener('click', () => { ui.day = day; renderWeek(weekKey, containerId); });
      pills.appendChild(pill);
    });
    bar.appendChild(pills);
  }
}

function renderDayColumn(col, weekKey, day, containerId){
  if(!state.schedule[weekKey][day]) state.schedule[weekKey][day] = [];
  const blocks = state.schedule[weekKey][day];
  blocks.forEach((b, bi) => {
    const div = document.createElement('div');
    div.className = 'block ' + blockCatClass(b);
    const t = document.createElement('div');
    t.className = 'time';
    t.textContent = b.start + '\u2013' + b.end;
    div.appendChild(t);

    const openEditor = () => {
      if(col.querySelector('.add-block-form')) renderWeek(weekKey, containerId);
      const form = buildBlockForm({start:b.start, end:b.end, activity:b.activity, cat:blockCatName(b)}, {
        saveLabel: 'Guardar',
        onSave: (v) => {
          state.schedule[weekKey][day][bi] = v;
          state.schedule[weekKey][day].sort((x, y) => x.start.localeCompare(y.start));
          saveState();
          renderWeek(weekKey, containerId);
        },
        onCancel: () => renderWeek(weekKey, containerId)
      });
      div.replaceWith(form);
      form._focus();
    };

    // Elección rápida entre las actividades de la lista
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Cambiar actividad');
    const known = ACTIVITY_LIST.indexOf(b.activity) !== -1;
    if(!known){
      const cur = document.createElement('option');
      cur.value = '__actual__'; cur.textContent = b.activity; cur.selected = true;
      sel.appendChild(cur);
    }
    ACTIVITY_LIST.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      if(a === b.activity) opt.selected = true;
      sel.appendChild(opt);
    });
    const other = document.createElement('option');
    other.value = '__otra__'; other.textContent = '\u270E Escribir otra\u2026';
    sel.appendChild(other);
    sel.addEventListener('change', (e) => {
      const v = e.target.value;
      if(v === '__otra__'){ e.target.value = known ? b.activity : '__actual__'; openEditor(); return; }
      if(v === '__actual__') return;
      state.schedule[weekKey][day][bi].activity = v;
      state.schedule[weekKey][day][bi].cat = CATEGORIES[v][0];
      saveState();
      renderWeek(weekKey, containerId);
    });
    div.appendChild(sel);

    const label = document.createElement('div');
    label.className = 'label' + (b.activity.length > 16 ? ' small' : '');
    label.textContent = b.activity;
    div.appendChild(label);

    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'edit-block';
    edit.textContent = '\u270E';
    edit.title = 'Editar horario y actividad';
    edit.setAttribute('aria-label', 'Editar ' + b.activity);
    edit.addEventListener('click', openEditor);
    div.appendChild(edit);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del-block';
    del.textContent = '\u00d7';
    del.title = 'Borrar bloque';
    del.setAttribute('aria-label', 'Borrar ' + b.activity);
    del.addEventListener('click', () => {
      state.schedule[weekKey][day].splice(bi, 1);
      saveState();
      renderWeek(weekKey, containerId);
    });
    div.appendChild(del);

    col.appendChild(div);
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'add-block-btn';
  addBtn.textContent = '+ Agregar bloque';
  addBtn.addEventListener('click', () => {
    showAddBlockForm(col, weekKey, day, containerId, addBtn);
  });
  col.appendChild(addBtn);
}

function renderWeek(weekKey, containerId){
  if(!state.schedule[weekKey]) state.schedule[weekKey] = {};
  renderWeekControls(weekKey, containerId);

  const ui = uiState[containerId];
  const el = document.querySelector('#' + containerId + ' .days');
  el.innerHTML = '';
  el.className = 'days' + (ui.mode === 'day' ? ' day-mode' : '');

  if(ui.mode === 'day'){
    const day = ui.day;
    const col = document.createElement('div');
    col.className = 'day-col';
    const title = document.createElement('div');
    title.className = 'day-title';
    title.textContent = DAYS[DAYS.indexOf(day)];
    col.appendChild(title);
    renderDayColumn(col, weekKey, day, containerId);
    el.appendChild(col);
  } else {
    DAYS.forEach((day, di) => {
      const col = document.createElement('div');
      col.className = 'day-col';
      const title = document.createElement('div');
      title.className = 'day-title';
      title.textContent = DAYS_SHORT[di];
      col.appendChild(title);
      renderDayColumn(col, weekKey, day, containerId);
      el.appendChild(col);
    });
  }

  const legendEl = document.querySelector('#' + containerId + ' .legend');
  legendEl.innerHTML = '';
  const seen = new Set();
  Object.values(CATEGORIES).forEach(([name, cls]) => {
    if(seen.has(name)) return;
    seen.add(name);
    const chip = document.createElement('span');
    chip.className = 'chip ' + cls;
    chip.textContent = name;
    legendEl.appendChild(chip);
  });
}

function pctOf(done, total){ return total ? Math.round(done / total * 100) : 0; }

function makeBar(p, label){
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.setAttribute('role', 'progressbar');
  bar.setAttribute('aria-valuemin', '0');
  bar.setAttribute('aria-valuemax', '100');
  bar.setAttribute('aria-valuenow', String(p));
  if(label) bar.setAttribute('aria-label', label);
  const fill = document.createElement('div');
  fill.className = 'bar-fill';
  fill.style.width = p + '%';
  bar.appendChild(fill);
  return bar;
}

function renderChecklist(kind){
  const items = state[kind];
  const singular = kind === 'tareas' ? 'tarea' : 'hábito';
  const card = document.getElementById(kind + '-card');
  const summary = document.getElementById(kind + '-summary');
  card.innerHTML = '';

  // Avance general de la semana
  const totalBoxes = items.length * 7;
  const totalDone = items.reduce((acc, it) => acc + it.days.filter(Boolean).length, 0);
  const overallPct = pctOf(totalDone, totalBoxes);
  const overall = document.createElement('div');
  overall.className = 'overall';
  const top = document.createElement('div');
  top.className = 'overall-top';
  top.innerHTML = '<span>Avance de la semana</span><strong>' + overallPct + '%</strong>';
  overall.appendChild(top);
  overall.appendChild(makeBar(overallPct, 'Avance de la semana'));
  const note = document.createElement('div');
  note.className = 'overall-note';
  note.textContent = items.length
    ? totalDone + ' de ' + totalBoxes + ' casilleros cumplidos'
    : 'Todavía no agregaste ningún ' + singular + '.';
  overall.appendChild(note);
  card.appendChild(overall);

  const header = document.createElement('div');
  header.className = 'row header';
  header.innerHTML = '<div>' + (kind === 'tareas' ? 'Tarea' : 'Hábito') + '</div>' +
    DAYS_SHORT.map(d => '<div style="text-align:center">' + d + '</div>').join('') +
    '<div style="text-align:right">Avance</div>';
  card.appendChild(header);

  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'row';

    const nameCell = document.createElement('div');
    nameCell.className = 'name-cell';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = kind === 'tareas' ? 'Ej: organizar vencimientos de recetas' : 'Ej: meditar 10 min';
    nameInput.value = item.name;
    nameInput.addEventListener('input', (e) => {
      state[kind][idx].name = e.target.value;
      saveState();
    });
    nameCell.appendChild(nameInput);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.title = 'Borrar este ' + singular;
    del.setAttribute('aria-label', 'Borrar ' + (item.name || singular));
    del.addEventListener('click', () => {
      if(item.name.trim() && !confirm('¿Borrar "' + item.name.trim() + '"?')) return;
      state[kind].splice(idx, 1);
      saveState();
      renderChecklist(kind);
    });
    nameCell.appendChild(del);
    row.appendChild(nameCell);

    item.days.forEach((val, di) => {
      const box = document.createElement('button');
      box.type = 'button';
      box.className = 'check' + (val ? ' on' : '');
      box.textContent = '✓';
      box.setAttribute('aria-pressed', val ? 'true' : 'false');
      box.setAttribute('aria-label', (item.name || singular) + ', ' + DAYS_SHORT[di]);
      box.addEventListener('click', () => {
        state[kind][idx].days[di] = !state[kind][idx].days[di];
        saveState();
        renderChecklist(kind);
        const again = card.querySelectorAll('.row:not(.header)')[idx];
        if(again){ const b = again.querySelectorAll('.check')[di]; if(b) b.focus({preventScroll:true}); }
      });
      row.appendChild(box);
    });

    const done = item.days.filter(Boolean).length;
    const p = pctOf(done, 7);
    const pct = document.createElement('div');
    pct.className = 'pct' + (p > 0 ? ' has-progress' : '');
    const num = document.createElement('span');
    num.textContent = p + '%';
    pct.appendChild(num);
    pct.appendChild(makeBar(p, 'Avance de ' + (item.name || singular)));
    row.appendChild(pct);

    card.appendChild(row);
  });

  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  addRow.setAttribute('role', 'button');
  addRow.tabIndex = 0;
  addRow.textContent = '+ Agregar ' + singular;
  const doAdd = () => {
    state[kind].push({id: kind + Date.now(), name:'', days:[false,false,false,false,false,false,false]});
    saveState();
    renderChecklist(kind);
    const inputs = card.querySelectorAll('.row:not(.header) input[type=text]');
    if(inputs.length) inputs[inputs.length - 1].focus();
  };
  addRow.addEventListener('click', doAdd);
  addRow.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doAdd(); } });
  card.appendChild(addRow);

  if(items.length){
    const resetRow = document.createElement('div');
    resetRow.className = 'reset-row';
    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'reset-btn';
    resetBtn.textContent = 'Empezar semana nueva';
    resetBtn.title = 'Destilda todos los días y deja los nombres';
    resetBtn.addEventListener('click', () => {
      if(!confirm('¿Destildar todos los días para empezar una semana nueva? Los nombres se mantienen.')) return;
      state[kind].forEach(it => { it.days = [false,false,false,false,false,false,false]; });
      saveState();
      renderChecklist(kind);
    });
    resetRow.appendChild(resetBtn);
    card.appendChild(resetRow);
  }

  summary.innerHTML = '';
  DAYS_SHORT.forEach((d, di) => {
    const dayDone = items.filter(it => it.days[di]).length;
    const dp = pctOf(dayDone, items.length);
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<div class="d">' + d + '</div><div class="v">' + dp + '%</div>';
    cell.appendChild(makeBar(dp, d));
    summary.appendChild(cell);
  });
}

function renderAll(){
  const steps = [
    () => renderWeek('Semana 1', 'semana1'),
    () => renderWeek('Semana 2', 'semana2'),
    () => renderWeek('Semana 3', 'semana3'),
    () => renderWeek('Semana 4', 'semana4'),
    () => renderChecklist('tareas'),
    () => renderChecklist('habitos')
  ];
  steps.forEach(fn => { try{ fn(); }catch(e){ console.error('Error al renderizar una sección', e); } });
}

document.querySelectorAll('.tab').forEach(tab => {

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});
